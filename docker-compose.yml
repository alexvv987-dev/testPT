name: url-shortener

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-shortener_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-shortener_migrator}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-shortener_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate-runtime
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_MIGRATOR_USER:-shortener_migrator}:${POSTGRES_MIGRATOR_PASSWORD:-shortener_migrator}@db:5432/${POSTGRES_DB:-shortener}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      APP_DATABASE_ROLE: shortener_app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app-runtime
    environment:
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://shortener_app:${POSTGRES_APP_PASSWORD:-shortener_app}@db:5432/${POSTGRES_DB:-shortener}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-3s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      READ_RATE_LIMIT_RPS: ${READ_RATE_LIMIT_RPS:-50}
      READ_RATE_LIMIT_BURST: ${READ_RATE_LIMIT_BURST:-100}
      GLOBAL_RATE_LIMIT_RPS: ${GLOBAL_RATE_LIMIT_RPS:-500}
      GLOBAL_RATE_LIMIT_BURST: ${GLOBAL_RATE_LIMIT_BURST:-1000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-200}
      LINK_TTL: ${LINK_TTL:-720h}
      MAX_LINKS: ${MAX_LINKS:-100000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
