name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6

jobs:
  go-quality-and-security:
    name: Go quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: shortener
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests with coverage
        run: |
          go test -coverprofile coverage.out ./internal/config ./internal/shortener ./internal/httpapi
          coverage="$(go tool cover -func coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) exit 1 }'

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://shortener:shortener@localhost:5432/shortener?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run race and integration tests
        env:
          TEST_DATABASE_URL: postgres://shortener:shortener@localhost:5432/shortener?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Run URL validator fuzzing
        run: go test ./internal/shortener -run '^$' -fuzz '^FuzzURLValidator$' -fuzztime 10s

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/govulncheck-bin
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check Go vulnerabilities
        run: ${{ runner.temp }}/govulncheck-bin/govulncheck ./...

  container-build-and-smoke:
    name: Container build and smoke test
    needs: go-quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag url-shortener:test .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: url-shortener:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Start Compose stack
        run: docker compose up --detach --build --wait app

      - name: Run smoke test
        run: sh scripts/smoke.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
